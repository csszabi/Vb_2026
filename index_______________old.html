  {id:"r16_5",phase:"R16",label:"R16-5",home:"R16 csapat",away:"R16 csapat",time:"2026-07-06T21:00:00"},
  {id:"r16_6",phase:"R16",label:"R16-6",home:"R16 csapat",away:"R16 csapat",time:"2026-07-07T02:00:00"},
  {id:"r16_7",phase:"R16",label:"R16-7",home:"R16 csapat",away:"R16 csapat",time:"2026-07-07T18:00:00"},
  {id:"r16_8",phase:"R16",label:"R16-8",home:"R16 csapat",away:"R16 csapat",time:"2026-07-07T22:00:00"},
  {id:"qf_1",phase:"NF",label:"NF-1",home:"NF csapat",away:"NF csapat",time:"2026-07-09T22:00:00"},
  {id:"qf_2",phase:"NF",label:"NF-2",home:"NF csapat",away:"NF csapat",time:"2026-07-10T21:00:00"},
  {id:"qf_3",phase:"NF",label:"NF-3",home:"NF csapat",away:"NF csapat",time:"2026-07-11T23:00:00"},
  {id:"qf_4",phase:"NF",label:"NF-4",home:"NF csapat",away:"NF csapat",time:"2026-07-12T03:00:00"},
  {id:"sf_1",phase:"EF",label:"EF-1",home:"EF csapat",away:"EF csapat",time:"2026-07-14T21:00:00"},
  {id:"sf_2",phase:"EF",label:"EF-2",home:"EF csapat",away:"EF csapat",time:"2026-07-15T21:00:00"},
  {id:"b3",phase:"3H",label:"3. helyért",home:"3. hely",away:"3. hely",time:"2026-07-18T23:00:00"},
  {id:"final",phase:"D",label:"Döntő",home:"Döntős",away:"Döntős",time:"2026-07-19T21:00:00"},
].map(m=>({...m,result:null}));
const ALL_MATCHES=[...GROUP_MATCHES,...KO_MATCHES];
const PHASE_ORDER=["csoport","R32","R16","NF","EF","3H","D"];
const PHASE_LABEL={csoport:"Csoportmérkőzések",R32:"32-es kör",R16:"Nyolcaddöntők",NF:"Negyeddöntők",EF:"Elődöntők","3H":"3. helyért",D:"Döntő"};

// ── State ────────────────────────────────────────────
const S = {
  username:"", tab:"matches", adminTab:"results",
  phase:"csoport", group:"A",
  matches:[...ALL_MATCHES], tips:{}, users:[],
  delConfirm:null, editRes:{},
  pollTimer:null
};

// ── Helpers ──────────────────────────────────────────
function calcPoints(tip,res){
  if(!res||tip.home===""||tip.away==="")return null;
  const th=+tip.home,ta=+tip.away,rh=+res.home,ra=+res.away;
  if(isNaN(th)||isNaN(ta))return null;
  if(th===rh&&ta===ra)return 3;
  const td=th-ta,rd=rh-ra;
  if(Math.sign(td)===Math.sign(rd)&&td===rd)return 2;
  if(Math.sign(td)===Math.sign(rd))return 1;
  return 0;
}
function isLocked(t){return new Date()>=new Date(new Date(t).getTime()-2*3600000);}
function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleDateString("hu-HU",{month:"short",day:"numeric",weekday:"short"})+" "+d.toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"});
}
function flagImg(name){
  const c=FLAG_CODES[name];
  return c?`<img src="https://flagcdn.com/w40/${c}.png" alt="${name}" style="width:22px;height:15px;border-radius:2px;object-fit:cover;flex-shrink:0">`:"";
}
function showToast(msg,type="ok"){
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg; t.className=`toast toast-${type}`; t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}
function show(id){["loading","login","main"].forEach(x=>document.getElementById(x).style.display=x===id?"block":"none");}

// ── Poll adatok ──────────────────────────────────────
async function pollData(){
  const [results, tips, users] = await Promise.all([
    dbGet("results"), dbGet("tips"), dbGet("users")
  ]);
  S.matches = ALL_MATCHES.map(m => results&&results[m.id] ? {...m,result:results[m.id]} : m);
  S.tips = tips||{};
  S.users = users ? Object.keys(users).filter(u=>u!==ADMIN) : [];

  // Ne renderelj újra ha éppen valaki inputba gépel
  const activeEl = document.activeElement;
  const isTyping = activeEl && (activeEl.dataset.mid || activeEl.dataset.res);
  if(S.username && !isTyping) renderMain();
}

function startPolling(){
  if(S.pollTimer) clearInterval(S.pollTimer);
  S.pollTimer = setInterval(pollData, 5000);
}

// ── Login ─────────────────────────────────────────────
document.getElementById("nameInput").addEventListener("input", function(){
  const isAdm = this.value.trim().toLowerCase()==="admin";
  const pwInput = document.getElementById("pwInput");
  const pwHint = document.getElementById("pwHint");
  if(isAdm){
    pwInput.placeholder="Admin jelszó";
    pwInput.removeAttribute("maxlength");
    pwInput.removeAttribute("inputmode");
    pwHint.style.display="none";
  } else {
    pwInput.placeholder="PIN kód (4 szám)";
    pwInput.setAttribute("maxlength","4");
    pwInput.setAttribute("inputmode","numeric");
    pwHint.style.display="block";
  }
});
document.getElementById("nameInput").addEventListener("keydown", e=>e.key==="Enter"&&doLogin());
document.getElementById("pwInput").addEventListener("keydown", e=>e.key==="Enter"&&doLogin());
document.getElementById("loginBtn").addEventListener("click", doLogin);

async function doLogin(){
  const n = document.getElementById("nameInput").value.trim();
  const pw = document.getElementById("pwInput").value.trim();
  const errEl = document.getElementById("pwError");
  errEl.style.display="none";

  if(!n){ errEl.textContent="Add meg a neved!"; errEl.style.display="block"; return; }
  if(!pw){ errEl.textContent="Add meg a PIN kódot!"; errEl.style.display="block"; return; }

  // Admin belépés
  if(n.toLowerCase()==="admin"){
    if(pw!==ADMIN_PW){ errEl.textContent="Hibás jelszó!"; errEl.style.display="block"; return; }
    S.username=ADMIN;
    show("main"); await pollData(); startPolling(); renderMain();
    return;
  }

  // Normál felhasználó — PIN ellenőrzés
  const existing = await dbGet(`users/${n}`);
  if(existing && existing.pin){
    // Már regisztrált — ellenőrizzük a PIN-t
    if(existing.pin !== pw){
      errEl.textContent="Hibás PIN kód!"; errEl.style.display="block"; return;
    }
  } else {
    // Első belépés — PIN rögzítése
    if(pw.length < 4){ errEl.textContent="A PIN kód 4 számjegyű legyen!"; errEl.style.display="block"; return; }
    await dbSet(`users/${n}`, { pin: pw });
  }

  S.username=n;
  show("main"); await pollData(); startPolling(); renderMain();
}

// ── Render ────────────────────────────────────────────
function renderMain(){
  const isAdmin = S.username===ADMIN;
  document.getElementById("header").innerHTML = renderHeader(isAdmin);
  document.getElementById("tabs").innerHTML = renderTabs(isAdmin);
  document.getElementById("content").innerHTML = renderContent(isAdmin);
  document.getElementById("modalContainer").innerHTML = S.delConfirm ? renderModal() : "";
  bindMainEvents(isAdmin);
}

function renderHeader(isAdmin){
  return `<div class="header">
    <div class="header-left"><span style="font-size:26px">⚽</span>
      <div><div class="header-title">VB 2026 Tippjáték</div>
      <div class="header-sub">FIFA World Cup · jún. 11 – júl. 19</div></div>
    </div>
    <div class="header-right">
      <span class="header-user">${isAdmin?"👑 Admin":S.username}</span>
      <button class="logout-btn" id="logoutBtn">Kilépés</button>
    </div>
  </div>`;
}

function renderTabs(isAdmin){
  const tabs=[["matches","⚽ Mérkőzések"],["leaderboard","🏅 Ranglista"],...(isAdmin?[["admin","🛠 Admin"]]:[])]
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab-btn ${S.tab===k?"active":""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
}

function renderContent(isAdmin){
  const phases=PHASE_ORDER.filter(p=>S.matches.some(m=>m.phase===p));
  const visible=S.matches.filter(m=>m.phase===S.phase&&(S.phase!=="csoport"||m.group===S.group));
  if(S.tab==="matches")     return renderMatches(visible,phases);
  if(S.tab==="leaderboard") return renderLeaderboard();
  if(S.tab==="admin"&&isAdmin) return renderAdmin(visible,phases);
  return "";
}

function renderPhaseFilters(style){
  const phases=PHASE_ORDER.filter(p=>S.matches.some(m=>m.phase===p));
  const groups=[...new Set(S.matches.filter(m=>m.phase==="csoport").map(m=>m.group))].sort();
  let h=`<div class="phase-filters">`;
  phases.forEach(p=>h+=`<button class="filter-btn ${S.phase===p?"a"+style:""}" data-phase="${p}">${PHASE_LABEL[p]}</button>`);
  h+=`</div>`;
  if(S.phase==="csoport"){
    h+=`<div class="group-filters">`;
    groups.forEach(g=>h+=`<button class="group-btn ${S.group===g?"a"+style:""}" data-group="${g}">${g}</button>`);
    h+=`</div>`;
  }
  return h;
}

function renderMatches(visible,phases){
  let h=renderPhaseFilters("g");
  h+=`<button id="saveTipsBtn" style="width:100%;margin-bottom:12px;padding:10px;border-radius:10px;border:none;background:#00c97a;color:#000;font-size:14px;font-weight:700;cursor:pointer;">💾 Tippek mentése</button>`;
  h+=`<div class="match-list">`;
  visible.forEach(m=>{
    const locked=isLocked(m.time);
    const myTip=(S.tips[S.username]||{})[m.id]||{};
    const pts=m.result?calcPoints(myTip,m.result):null;
    const scoreHtml=locked
      ?`<div class="score-wrap"><div class="score-box">${myTip.home??"-"}</div><span class="score-sep">–</span><div class="score-box">${myTip.away??"-"}</div></div>`
      :`<div class="score-wrap"><input class="score-input" type="number" min="0" max="20" value="${myTip.home??""}" data-mid="${m.id}" data-side="home"/><span class="score-sep">–</span><input class="score-input" type="number" min="0" max="20" value="${myTip.away??""}" data-mid="${m.id}" data-side="away"/></div>`;
    const resultRow=`<div style="text-align:center;padding:5px 0 6px;font-size:12px;color:#ffffff;border-top:1px solid #222;">${m.result ? `Végeredmény: <span style="font-weight:600;">${m.result.home}–${m.result.away}</span> ${badgeHtml(pts)}` : `Végeredmény: –`}</div>`;
    h+=`<div class="match-card">
      <div class="match-head">
        <span class="match-info" style="color:#ffffff">${m.group?m.group+" csoport":(m.label||"")} · ${fmtTime(m.time)}</span>
        <div class="match-badges">
          ${locked&&!m.result?`<span class="badge badge-locked">Lezárva</span>`:""}
        </div>
      </div>
      <div class="match-body">
        <span class="team team-home">${m.home}${flagImg(m.home)}</span>
        ${scoreHtml}
        <span class="team team-away">${flagImg(m.away)}${m.away}</span>
      </div>
      ${resultRow}
    </div>`;
  });
  return h+`</div>`;
}

function badgeHtml(pts){
  if(pts===3)return`<span class="badge badge-3">3 pont ✓</span>`;
  if(pts===2)return`<span class="badge badge-2">2 pont</span>`;
  if(pts===1)return`<span class="badge badge-1">1 pont</span>`;
  if(pts===0)return`<span class="badge badge-0">0 pont</span>`;
  return"";
}

function getPoints(u){
  return S.matches.reduce((s,m)=>{
    if(!m.result)return s;
    const tip=(S.tips[u]||{})[m.id];if(!tip)return s;
    const p=calcPoints(tip,m.result);return p!==null?s+p:s;
  },0);
}

function renderLeaderboard(){
  const board=[...S.users].map(u=>({name:u,pts:getPoints(u)})).sort((a,b)=>b.pts-a.pts);
  const mc=i=>i===0?"#f0a500":i===1?"#aaa":i===2?"#cd7f32":"#444";
  let h=`<div class="board-list">`;
  if(!board.length)h+=`<p class="empty">Még nincs résztvevő.</p>`;
  board.forEach((u,i)=>h+=`<div class="board-row ${u.name===S.username?"me":""}">
    <span class="rank-badge" style="border:1px solid ${mc(i)}55;color:${mc(i)}">${i+1}</span>
    <span class="board-name" style="font-weight:${u.name===S.username?700:400}">${u.name}</span>
    <span class="board-pts" style="color:${i===0?"#f0a500":"#00c97a"}">${u.pts}</span>
    <span class="board-lbl">pont</span>
  </div>`);
  h+=`</div><div class="rules-card"><div class="rules-title">Pontozási szabályok</div>`;
  [[3,"rgba(0,201,122,.12)","#00c97a","Pontos eredmény"],[2,"rgba(76,163,255,.12)","#4ca3ff","Helyes gólkülönbség + győztes"],[1,"rgba(240,165,0,.12)","#f0a500","Csak a győztes eltalálva"],[0,"rgba(255,82,82,.12)","#ff5252","Téves tipp"]].forEach(([p,bg,col,txt])=>
    h+=`<div class="rule-row"><span class="rule-badge" style="background:${bg};color:${col}">${p} pont</span><span class="rule-txt">${txt}</span></div>`
  );
  return h+`</div>`;
}

function renderAdmin(visible,phases){
  let h=`<div class="admin-tabs">
    <button class="admin-tab ${S.adminTab==="results"?"active":""}" data-atab="results">📋 Eredmények</button>
    <button class="admin-tab ${S.adminTab==="players"?"active":""}" data-atab="players">👥 Játékosok</button>
  </div>`;
  if(S.adminTab==="results"){
    h+=`<p class="admin-hint">Mérkőzések valós eredményének rögzítése.</p>`+renderPhaseFilters("p");
    visible.forEach(m=>{
      const er=S.editRes[m.id]||{};
      h+=`<div class="admin-card">
        <div class="admin-head">${m.group?m.group+" csoport":(m.label||"")} · ${fmtTime(m.time)}</div>
        <div class="admin-body">
          <span class="team team-home" style="font-size:13px">${m.home}${flagImg(m.home)}</span>
          <input class="score-input" type="number" min="0" max="20" placeholder="–" value="${er.home??(m.result?.home??'')}" data-res="${m.id}" data-res-side="home" style="border-color:rgba(180,158,255,.33)"/>
          <span class="score-sep">–</span>
          <input class="score-input" type="number" min="0" max="20" placeholder="–" value="${er.away??(m.result?.away??'')}" data-res="${m.id}" data-res-side="away" style="border-color:rgba(180,158,255,.33)"/>
          <span class="team team-away" style="font-size:13px">${flagImg(m.away)}${m.away}</span>
          <button class="save-btn" data-save="${m.id}">Mentés</button>
        </div>
        ${m.result?`<div class="saved-bar">✓ ${m.result.home}–${m.result.away}</div>`:""}
      </div>`;
    });
  }
  if(S.adminTab==="players"){
    h+=`<p class="admin-hint">Regisztrált játékosok kezelése.</p>`;
    if(!S.users.length)h+=`<p class="empty">Még nincs regisztrált játékos.</p>`;
    S.users.forEach((u,i)=>{
      const pts=getPoints(u), tc=Object.keys(S.tips[u]||{}).length;
      h+=`<div class="player-card">
        <div class="player-avatar">${u[0].toUpperCase()}</div>
        <div class="player-info"><div class="player-name">${u}</div><div class="player-meta">${tc} tipp · ${pts} pont</div></div>
        <span class="player-rank">#${i+1}</span>
        <button class="del-btn" data-del="${u}">🗑 Törlés</button>
      </div>`;
    });
    if(S.users.length){
      const total=Object.values(S.tips).reduce((s,t)=>s+Object.keys(t).length,0);
      h+=`<div class="summary"><strong style="color:#b49eff">Összesítés:</strong> ${S.users.length} játékos · ${total} tipp összesen</div>`;
    }
  }
  return h;
}

function renderModal(){
  return `<div class="modal-overlay">
    <div class="modal">
      <div class="modal-icon">🗑</div>
      <div class="modal-title">Játékos törlése</div>
      <div class="modal-text">Biztosan törlöd <strong>${S.delConfirm}</strong> játékost? Minden tippje törlődik.</div>
      <div class="modal-btns">
        <button class="modal-cancel" id="cancelDel">Mégse</button>
        <button class="modal-del" id="confirmDel">Törlés</button>
      </div>
    </div>
  </div>`;
}

function bindMainEvents(isAdmin){
  document.getElementById("logoutBtn")?.addEventListener("click",()=>{
    clearInterval(S.pollTimer); S.username=""; S.tab="matches";
    show("login");
    document.getElementById("nameInput").value="";
    document.getElementById("pwInput").value="";
    document.getElementById("pwWrap").style.display="none";
  });
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;renderMain();}));
  document.querySelectorAll("[data-atab]").forEach(b=>b.addEventListener("click",()=>{S.adminTab=b.dataset.atab;renderMain();}));
  document.querySelectorAll("[data-phase]").forEach(b=>b.addEventListener("click",()=>{S.phase=b.dataset.phase;renderMain();}));
  document.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{S.group=b.dataset.group;renderMain();}));
  // Mentés gombok
  const doSaveAll = async () => {
    const inputs = document.querySelectorAll(".score-input[data-mid]");
    const saves = [];
    inputs.forEach(inp => {
      const mid=inp.dataset.mid, side=inp.dataset.side, val=inp.value;
      if(val==="") return;
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=val;
      saves.push(dbSet(`tips/${S.username}/${mid}/${side}`,val));
    });
    await Promise.all(saves);
    showToast("Tippek elmentve ✓");
  };
  document.getElementById("saveTipsBtn")?.addEventListener("click", doSaveAll);

  // Input: azonnal mentés gépelés közben (debounce 800ms)
  const debounceTimers = {};
  document.querySelectorAll(".score-input[data-mid]").forEach(inp => {
    inp.addEventListener("input", () => {
      const mid=inp.dataset.mid, side=inp.dataset.side, val=inp.value;
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=val;
      // Debounce: 800ms után menti ha nem gépel tovább
      clearTimeout(debounceTimers[mid+side]);
      debounceTimers[mid+side]=setTimeout(()=>{
        if(val!=="") dbSet(`tips/${S.username}/${mid}/${side}`,val);
      }, 800);
    });
  });
  // Admin result input
  document.querySelectorAll(".score-input[data-res]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const mid=inp.dataset.res,side=inp.dataset.resSide;
      S.editRes[mid]=S.editRes[mid]||{};
      S.editRes[mid][side]=inp.value;
    });
  });
  document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",async()=>{
    const mid=b.dataset.save, r=S.editRes[mid];
    if(!r||r.home===undefined||r.away===undefined)return;
    await dbSet(`results/${mid}`,{home:r.home,away:r.away});
    showToast("Eredmény elmentve ✓");
    await pollData();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{S.delConfirm=b.dataset.del;renderMain();}));
  document.getElementById("cancelDel")?.addEventListener("click",()=>{S.delConfirm=null;renderMain();});
  document.getElementById("confirmDel")?.addEventListener("click",async()=>{
    const name=S.delConfirm;
    await dbDel(`users/${name}`);
    await dbDel(`tips/${name}`);
    S.delConfirm=null;
    showToast(`${name} törölve`,"info");
    await pollData();
  });
}

// ── Indítás ───────────────────────────────────────────
show("login");
</script>
</body>
</html>
