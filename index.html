// ── Standings ────────────────────────────
function groupStandings(group,matches){
  const teams=[...new Set(matches.filter(m=>m.group===group).flatMap(m=>[m.home,m.away]))];
  const s={};
  teams.forEach(t=>s[t]={pts:0,mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0});
  matches.filter(m=>m.phase==="csoport"&&m.group===group&&m.result).forEach(m=>{
    const rh=+m.result.home,ra=+m.result.away;
    s[m.home].mp++;s[m.away].mp++;
    s[m.home].gf+=rh;s[m.home].ga+=ra;s[m.home].gd+=rh-ra;
    s[m.away].gf+=ra;s[m.away].ga+=rh;s[m.away].gd+=ra-rh;
    if(rh>ra){s[m.home].pts+=3;s[m.home].w++;s[m.away].l++;}
    else if(rh===ra){s[m.home].pts++;s[m.away].pts++;s[m.home].d++;s[m.away].d++;}
    else{s[m.away].pts+=3;s[m.away].w++;s[m.home].l++;}
  });
  return Object.entries(s).map(([name,v])=>({name,...v})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function bestThirds(matches){
  return GROUPS.map(g=>{
    const st=groupStandings(g,matches);
    const played=matches.filter(m=>m.phase==="csoport"&&m.group===g&&m.result).length;
    if(played<6||st.length<3)return null;
    return{...st[2],group:g};
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8);
}
function getQualified(matches){
  const q={};
  GROUPS.forEach(g=>{
    const st=groupStandings(g,matches);
    const played=matches.filter(m=>m.phase==="csoport"&&m.group===g&&m.result).length;
    if(played>=6){q[`${g}1`]=st[0]?.name;q[`${g}2`]=st[1]?.name;q[`${g}3`]=st[2]?.name;}
  });
  bestThirds(matches).forEach((t,i)=>q[`3rd_${i+1}`]=t.name);
  return q;
}
function matchesWithTeams(matches){
  const q=getQualified(matches);
  const ov=S.overrideTeams||{};
  const winner=(res,id)=>{
    const m=res.find(x=>x.id===id);
    if(!m||!m.result)return null;
    return +m.result.home>+m.result.away?m.home:(+m.result.away>+m.result.home?m.away:null);
  };
  const loser=(res,id)=>{
    const m=res.find(x=>x.id===id);
    if(!m||!m.result)return null;
    return +m.result.home>+m.result.away?m.away:(+m.result.away>+m.result.home?m.home:null);
  };
  let res=matches.map(m=>({...m}));
  for(let pass=0;pass<6;pass++){
    res=res.map(m=>{
      if(m.phase==="csoport")return m;
      if(!m.hs&&!m.as)return m;
      const resolveSlot=slot=>{
        if(!slot)return null;
        if(q[slot])return q[slot];
        if(slot.startsWith("3rd"))return slotLabel(slot);
        if(slot.endsWith("_loser"))return loser(res,slot.replace("_loser",""));
        return winner(res,slot);
      };
      const h=ov[m.id]?.home||resolveSlot(m.hs)||m.home;
      const a=ov[m.id]?.away||resolveSlot(m.as)||m.away;
      return{...m,home:h||slotLabel(m.hs),away:a||slotLabel(m.as)};
    });
  }
  return res;
}

// ── Helpers ──────────────────────────────
function calcPts(tip,res){
  if(!res||tip.home===""||tip.away==="")return null;
  const th=+tip.home,ta=+tip.away,rh=+res.home,ra=+res.away;
  if(isNaN(th)||isNaN(ta))return null;
  if(th===rh&&ta===ra)return 3;
  const td=th-ta,rd=rh-ra;
  if(Math.sign(td)===Math.sign(rd)&&td===rd)return 2;
  if(Math.sign(td)===Math.sign(rd))return 1;
  return 0;
}
function isLocked(t){return new Date()>=new Date(new Date(t).getTime()-7200000);}
function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleDateString("hu-HU",{month:"short",day:"numeric",weekday:"short"})+" "+d.toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"});
}
function fi(name,size=22){
  const c=FLAG_CODES[name];
  return c?`<img src="https://flagcdn.com/w40/${c}.png" alt="${name}" style="width:${size}px;height:${Math.round(size*.67)}px;border-radius:2px;object-fit:cover;flex-shrink:0">`:"";}
function showToast(msg,type="ok"){
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;t.className=`toast toast-${type}`;t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}
const OINP=`oninput="this.value=this.value.replace(/[^0-9]/g,'');if(this.value.length>1&&this.value[0]==='0')this.value=this.value.slice(1);if(this.value.length>2)this.value=this.value.slice(0,2)"`;

async function pollData(){

  ]);
  S.overrideTeams=overrides||{};
  const base=ALL_MATCHES.map(m=>results&&results[m.id]?{...m,result:results[m.id]}:{...m,result:null});
  S.matches=matchesWithTeams(base);
  S.tips=tips||{};
  S.users=users?Object.keys(users).filter(u=>u!==ADMIN):[];
  const ae=document.activeElement;
  const busy=ae&&(ae.dataset.mid||ae.dataset.res||ae.dataset.override);
  if(S.username&&!busy)renderMain();
}
function startPolling(){
  if(S.pollTimer)clearInterval(S.pollTimer);
  S.pollTimer=setInterval(pollData,5000);

  if(isAdm){pi.placeholder="Admin jelszó";pi.removeAttribute("maxlength");pi.removeAttribute("inputmode");ph.style.display="none";}

});

async function doLogin(){
  const n=document.getElementById("nameInput").value.trim();
  const pw=document.getElementById("pwInput").value.trim();
  const err=document.getElementById("pwError");
  err.style.display="none";
  if(!n){err.textContent="Add meg a neved!";err.style.display="block";return;}
  if(!pw){err.textContent="Add meg a PIN kódot!";err.style.display="block";return;}
  if(n.toLowerCase()==="admin"){
    if(pw!==ADMIN_PW){err.textContent="Hibás jelszó!";err.style.display="block";return;}
    S.username=ADMIN; S.tab="results";
  }else{
    const ex=await dbGet(`users/${n}`);
    if(ex&&ex.pin){
      if(ex.pin!==pw){err.textContent="Hibás PIN kód!";err.style.display="block";return;}
    }else{
      if(pw.length<4){err.textContent="A PIN kód 4 számjegyű legyen!";err.style.display="block";return;}
      await dbSet(`users/${n}`,{pin:pw});
    }
    S.username=n; S.tab="matches";
  }
  lsSet(LS_USER,S.username);
  lsSet(LS_TAB,S.tab);
  showPage("pg-main");
  await pollData();
  startPolling();
  renderMain();
}

      ?`<span class="team team-away" style="font-size:13px">${fi(m.away)}${m.away}</span>`
      :`<input type="text" value="${ovA}" data-override="${m.id}" data-override-side="away" class="ov-input" placeholder="Vendég" style="flex:1;text-align:left"/>`;
    h+=`<div class="admin-card">
      <div class="admin-head">${m.group?m.group+" csoport":(m.label||"")} · ${fmtTime(m.time)}</div>
      <div class="admin-body">
        ${hF}
        <input class="score-input" type="text" inputmode="numeric" maxlength="2" placeholder="–" value="${er.home??(m.result?.home??'')}" data-res="${m.id}" data-res-side="home" style="border-color:rgba(180,158,255,.33)" ${OINP}/>
        <span class="score-sep">–</span>
        <input class="score-input" type="text" inputmode="numeric" maxlength="2" placeholder="–" value="${er.away??(m.result?.away??'')}" data-res="${m.id}" data-res-side="away" style="border-color:rgba(180,158,255,.33)" ${OINP}/>
        ${aF}
      </div>
    </div>`;
  });
  return h||`<p class="empty">Nincs mérkőzés.</p>`;
}

function renderPlayers(){
  let h=`<p style="color:#888;font-size:13px;margin-bottom:14px">Regisztrált játékosok kezelése.</p>`;
  if(!S.users.length)return h+`<p class="empty">Még nincs regisztrált játékos.</p>`;
  S.users.forEach((u,i)=>{
    const pts=getPoints(u),tc=Object.keys(S.tips[u]||{}).length;
    h+=`<div class="player-card">
      <div class="player-avatar">${u[0].toUpperCase()}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${u}</div><div style="font-size:12px;color:#444">${tc} tipp · ${pts} pont</div></div>
      <span style="font-size:12px;padding:3px 10px;border-radius:8px;background:#1c1c1c;color:#888;border:1px solid #272727">#${i+1}</span>
      <button class="del-btn" data-del="${u}">🗑 Törlés</button>
    </div>`;
  });
  const tot=Object.values(S.tips).reduce((s,t)=>s+Object.keys(t).length,0);
  return h+`<div style="margin-top:16px;background:#141414;border:1px solid #272727;border-radius:12px;padding:12px 16px;font-size:13px;color:#888"><strong style="color:#b49eff">Összesítés:</strong> ${S.users.length} játékos · ${tot} tipp</div>`;
}

function renderModal(){
  return`<div class="modal-overlay">
    <div class="modal">
      <div style="font-size:32px;margin-bottom:12px">🗑</div>
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">Játékos törlése</div>
      <div style="color:#888;font-size:14px">Biztosan törlöd <strong style="color:#f0f0f0">${S.delConfirm}</strong> játékost?</div>
      <div class="modal-btns">
        <button class="modal-cancel" id="cancelDel">Mégse</button>
        <button class="modal-del" id="confirmDel">Törlés</button>
      </div>
    </div>
  </div>`;
}

// ── Events ───────────────────────────────
function bindEvents(){
  document.getElementById("logoutBtn")?.addEventListener("click",()=>{
    clearInterval(S.pollTimer);
    S.username=""; S.tab="matches";
    lsDel(LS_USER); lsDel(LS_TAB);
    showPage("pg-login");
    document.getElementById("nameInput").value="";
    document.getElementById("pwInput").value="";
    document.getElementById("pwHint").style.display="block";
  });

  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
    S.tab=b.dataset.tab; lsSet(LS_TAB,S.tab); renderMain();
  }));
  document.querySelectorAll("[data-phase]").forEach(b=>b.addEventListener("click",()=>{S.phase=b.dataset.phase;renderMain();}));
  document.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{S.group=b.dataset.group;renderMain();}));

  // Tipp inputok
  document.querySelectorAll(".score-input[data-mid]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const {mid,side}=inp.dataset;
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=inp.value;
    });
    inp.addEventListener("blur",async()=>{
      const {mid,side}=inp.dataset; const val=inp.value;
      if(val==="")return;
      const os=side==="home"?"away":"home";
      const oi=document.querySelector(`.score-input[data-mid="${mid}"][data-side="${os}"]`);
      const ov2=oi?oi.value:((S.tips[S.username]||{})[mid]||{})[os]??"";
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=val;
      await dbSet(`tips/${S.username}/${mid}/${side}`,val);
      if(val&&ov2){
        const hv=side==="home"?val:ov2, av=side==="away"?val:ov2;
        S.savedTips[mid]={home:hv,away:av};
        const card=inp.closest(".match-card");
        if(card){
          card.querySelectorAll(".saved-tip-row").forEach(el=>el.remove());
          const div=document.createElement("div");
          div.className="saved-tip-row";
          div.innerHTML=`✓ Tipp elmentve: ${hv}–${av}`;
          card.appendChild(div);
        }
      }
    });
  });

  // Admin eredmény inputok
  document.querySelectorAll(".score-input[data-res]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const mid=inp.dataset.res, side=inp.dataset.resSide;
      S.editRes[mid]=S.editRes[mid]||{};
      S.editRes[mid][side]=inp.value;
    });
    inp.addEventListener("blur",async()=>{
      const mid=inp.dataset.res;
      const r=S.editRes[mid];
      if(!r||r.home===undefined||r.away===undefined||r.home===""||r.away==="")return;
      await dbSet(`results/${mid}`,{home:r.home,away:r.away});
      await pollData();
    });
  });

  // Override csapatnevek
  document.querySelectorAll("[data-override]").forEach(inp=>{
    inp.addEventListener("blur",async()=>{
      const mid=inp.dataset.override, side=inp.dataset.overrideSide, val=inp.value.trim();
      if(!val)return;
      S.overrideTeams[mid]=S.overrideTeams[mid]||{};
      S.overrideTeams[mid][side]=val;
      await dbSet(`overrides/${mid}/${side}`,val);
      if(FLAG_CODES[val]){
        const span=document.createElement("span");
        span.className=`team ${side==="home"?"team-home":"team-away"}`;
        span.style.fontSize="13px";
        span.innerHTML=side==="home"?`${val}${fi(val)}`:`${fi(val)}${val}`;
        inp.replaceWith(span);
      }
      await pollData();
    });
  });

  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{S.delConfirm=b.dataset.del;renderMain();}));
  document.getElementById("cancelDel")?.addEventListener("click",()=>{S.delConfirm=null;renderMain();});
  document.getElementById("confirmDel")?.addEventListener("click",async()=>{
    const name=S.delConfirm;
    await dbDel(`users/${name}`); await dbDel(`tips/${name}`);
    S.delConfirm=null; showToast(`${name} törölve`,"info"); await pollData();
  });
}

// ── Indítás ──────────────────────────────
async function init(){
  const savedUser=lsGet(LS_USER);
  const savedTab=lsGet(LS_TAB);
  if(savedUser){
    showPage("pg-loading");
    S.username=savedUser;
    S.tab=savedTab||(savedUser===ADMIN?"results":"matches");
    await pollData();
    startPolling();
    showPage("pg-main");
    renderMain();
  } else {
    showPage("pg-login");
  }
}

init();
</script>
</body>
</html>
