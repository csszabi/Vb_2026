<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
button{cursor:pointer;font-family:inherit}
.app{max-width:720px;margin:0 auto;padding:12px}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.loading-bar{width:180px;height:3px;background:#1c1c1c;border-radius:4px;overflow:hidden}
.loading-bar-inner{height:100%;width:60%;background:#00c97a;border-radius:4px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1rem}
.login-card{background:#141414;border-radius:20px;border:1px solid #333;padding:40px 36px;max-width:380px;width:100%;text-align:center}
.login-icon{width:72px;height:72px;border-radius:50%;background:rgba(0,201,122,.12);border:1px solid rgba(0,201,122,.2);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px}
.login-input{padding:9px 13px;border-radius:10px;border:1px solid #333;font-size:15px;outline:none;color:#f0f0f0;background:#1a1a1a;width:100%;margin-bottom:10px;display:block}
.login-btn{padding:9px 18px;border-radius:10px;border:none;background:#00c97a;color:#000;font-weight:700;font-size:15px;width:100%;margin-bottom:12px}
.pw-error{color:#ff5252;font-size:12px;margin-top:4px;display:none}
.main-wrap{border-radius:18px;overflow:hidden;border:1px solid #333}
.header{background:linear-gradient(135deg,#0c1f14,#081510);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,201,122,.15)}
.header-left{display:flex;align-items:center;gap:10px}
.header-title{font-weight:700;font-size:16px}
.header-sub{font-size:11px;color:#00c97a;opacity:.8}
.logout-btn{font-size:12px;padding:4px 12px;border-radius:8px;border:1px solid #333;background:transparent;color:#888}
.tabs{background:#141414;display:flex;border-bottom:1px solid #222;overflow-x:auto}
.tab-btn{flex:1;min-width:70px;padding:11px 6px;border:none;background:transparent;font-size:12px;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:#00c97a;border-bottom-color:#00c97a;font-weight:700}
.content{background:#0a0a0a;padding:16px;min-height:300px}
.phase-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.group-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid #333;background:transparent;color:#888}
.filter-btn.ag{border-color:#00c97a;background:rgba(0,201,122,.12);color:#00c97a;font-weight:600}
.filter-btn.ap{border-color:#b49eff;background:rgba(180,158,255,.12);color:#b49eff;font-weight:600}
.group-btn{width:34px;height:34px;border-radius:8px;font-size:13px;border:1px solid #333;background:transparent;color:#888}
.group-btn.ag{border-color:#00c97a;background:rgba(0,201,122,.12);color:#00c97a;font-weight:600}
.group-btn.ap{border-color:#b49eff;background:rgba(180,158,255,.12);color:#b49eff;font-weight:600}
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{background:#141414;border:1px solid #272727;border-radius:12px;overflow:hidden}
.match-head{padding:5px 12px;display:flex;justify-content:space-between;align-items:center;background:#1c1c1c;border-bottom:1px solid #272727}
.match-info{font-size:11px;color:#fff}
.badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700}
.badge-locked{background:rgba(240,165,0,.12);color:#f0a500}
.badge-3{background:rgba(0,201,122,.12);color:#00c97a}
.badge-2{background:rgba(76,163,255,.12);color:#4ca3ff}
.badge-1{background:rgba(240,165,0,.12);color:#f0a500}
.badge-0{background:rgba(255,82,82,.12);color:#ff5252}
.match-body{display:flex;align-items:center;gap:8px;padding:10px 12px}
.team{flex:1;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:#f0f0f0}
.team-home{justify-content:flex-end}
.team-away{justify-content:flex-start}
.team img,.flag-name img{width:22px;height:15px;border-radius:2px;object-fit:cover;flex-shrink:0}
.score-wrap{display:flex;gap:4px;align-items:center}
.score-box{width:36px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid #272727;border-radius:7px;font-size:14px;color:#888;background:#1c1c1c}
.score-input{width:42px;text-align:center;padding:5px 0;border-radius:7px;border:1px solid #333;font-size:15px;color:#f0f0f0;background:#222;outline:none}
.score-sep{color:#444;font-weight:700}
.result-row{text-align:center;padding:5px 0 6px;font-size:12px;color:#fff;border-top:1px solid #222}
.saved-tip-row{text-align:center;padding:3px 0;font-size:11px;color:#00c97a;background:rgba(0,201,122,.08);border-top:1px solid rgba(0,201,122,.15)}
.board-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.board-row{display:flex;align-items:center;gap:12px;background:#141414;border:1px solid #272727;border-radius:12px;padding:10px 16px}
.board-row.me{background:rgba(0,201,122,.12);border-color:rgba(0,201,122,.27)}
.board-row.first{background:#1e1800;border-color:rgba(240,165,0,.35)}
.board-row.second{background:#161616;border-color:rgba(180,180,180,.25)}
.rank-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1c1c1c;font-size:13px;font-weight:700}
.rules-card{background:#141414;border:1px solid #272727;border-radius:12px;padding:12px 16px}
.rule-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.rule-badge{padding:1px 8px;border-radius:8px;font-weight:700;font-size:12px;min-width:48px;text-align:center}
.admin-card{background:#141414;border:1px solid #272727;border-radius:12px;overflow:hidden;margin-bottom:8px}
.admin-head{padding:5px 12px;background:#1c1c1c;border-bottom:1px solid #272727;font-size:11px;color:#fff}
.admin-body{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.player-card{background:#141414;border:1px solid #272727;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.player-avatar{width:36px;height:36px;border-radius:50%;background:rgba(180,158,255,.12);border:1px solid rgba(180,158,255,.27);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#b49eff;flex-shrink:0}
.del-btn{padding:5px 11px;border-radius:8px;border:1px solid rgba(255,82,82,.27);background:rgba(255,82,82,.12);color:#ff5252;font-size:12px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:#141414;border-radius:16px;border:1px solid rgba(255,82,82,.27);padding:28px 32px;max-width:340px;width:90%;text-align:center}
.modal-btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.modal-cancel{padding:8px 20px;border-radius:10px;border:1px solid #333;background:transparent;font-size:14px;color:#888}
.modal-del{padding:8px 20px;border-radius:10px;border:none;background:#ff5252;color:#fff;font-size:14px;font-weight:700}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:12px;font-weight:600;font-size:13px;z-index:1000;white-space:nowrap;pointer-events:none;display:none}
.toast-ok{background:#1c1c1c;color:#00c97a;border:1px solid rgba(0,201,122,.27)}
.toast-info{background:#1c1c1c;color:#4ca3ff;border:1px solid rgba(76,163,255,.27)}
.empty{color:#444;text-align:center;padding:24px 0;font-size:14px}
.table-card{background:#141414;border:1px solid #272727;border-radius:12px;overflow:hidden;margin-bottom:16px}
.table-title{padding:8px 14px;background:#1c1c1c;border-bottom:1px solid #272727;font-size:13px;font-weight:700;color:#00c97a}
.standings-table{width:100%;border-collapse:collapse;font-size:12px}
.standings-table th{padding:6px;color:#888;font-weight:500;text-align:center;border-bottom:1px solid #272727}
.standings-table th:nth-child(2){text-align:left}
.standings-table td{padding:7px 6px;text-align:center;border-bottom:1px solid #1a1a1a;color:#f0f0f0}
.standings-table td:nth-child(2){text-align:left}
.standings-table tr:last-child td{border-bottom:none}
.standings-table tr.q1{background:rgba(0,201,122,.10);border-left:3px solid #00c97a}
.standings-table tr.q2{background:rgba(0,201,122,.10);border-left:3px solid #00c97a}
.standings-table tr.q3{background:rgba(180,100,30,.12);border-left:3px solid rgba(205,127,50,.6)}
.pos-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;margin-right:2px}
.p1{background:rgba(0,201,122,.2);color:#00c97a}
.p2{background:rgba(0,201,122,.1);color:#00c97a}
.p3{background:rgba(240,165,0,.15);color:#f0a500}
.p4{background:rgba(255,82,82,.1);color:#ff5252}
.flag-name{display:flex;align-items:center;gap:5px}
.mode-btn{padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;transition:all .15s}
.mode-btn:hover{border-color:#00c97a;color:#00c97a}
.mode-btn.mode-active{border-color:#00c97a;background:rgba(0,201,122,.15);color:#00c97a;font-weight:600}
/* Light theme */
body.light{background:#f0f4f0;color:#1a1a1a}
body.light .main-wrap{border-color:#b2dfdb}
body.light .header{background:linear-gradient(135deg,#0c1f14,#0f6e56)}
body.light .tabs{background:#fff;border-bottom-color:#e0f0eb}

body.light .tab-btn.active{color:#00a865;border-bottom-color:#00a865}
body.light .content{background:#f0f4f0}

body.light .match-head{background:#e8f5e9;border-bottom-color:#c8e6c9}

body.light .rules-card,body.light .table-card,body.light .admin-card,body.light .player-card{background:#fff;border-color:#d4ede3}
body.light .table-title{background:#e8f5e9;border-bottom-color:#c8e6c9}
body.light .admin-head{background:#ede9f6;color:#534AB7;border-bottom-color:#d4d0ea}
body.light .standings-table th{color:#555;border-bottom-color:#e0f0eb}
body.light .standings-table td{color:#1a1a1a;border-bottom-color:#f0f4f0}
body.light .login-card{background:#fff;border-color:#c8e6c9}
body.light .login-input{background:#f5f5f5;border-color:#c8e6c9;color:#1a1a1a}

body.light .group-btn{border-color:#c8e6c9;color:#555}
body.light .ov-input{background:#fff;color:#1a1a1a}
body.light .modal{background:#fff}
body.light .score-sep{color:#aaa}
body.light code{background:#f0f4f0;color:#555}

function groupStandings(group,matches){
  const teams=[...new Set(matches.filter(m=>m.group===group).flatMap(m=>[m.home,m.away]))];
  const s={};
  teams.forEach(t=>s[t]={pts:0,mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0});
  matches.filter(m=>m.phase==="csoport"&&m.group===group&&m.result).forEach(m=>{
    const rh=+m.result.home,ra=+m.result.away;
    s[m.home].mp++;s[m.away].mp++;
    s[m.home].gf+=rh;s[m.home].ga+=ra;s[m.home].gd+=rh-ra;
    s[m.away].gf+=ra;s[m.away].ga+=rh;s[m.away].gd+=ra-rh;
    if(rh>ra){s[m.home].pts+=3;s[m.home].w++;s[m.away].l++;}
    else if(rh===ra){s[m.home].pts++;s[m.away].pts++;s[m.home].d++;s[m.away].d++;}
    else{s[m.away].pts+=3;s[m.away].w++;s[m.home].l++;}
  });
  return Object.entries(s).map(([name,v])=>({name,...v})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function bestThirds(matches){
  return GROUPS.map(g=>{
    const st=groupStandings(g,matches);
    const played=matches.filter(m=>m.phase==="csoport"&&m.group===g&&m.result).length;
    if(played<6||st.length<3)return null;
    return{...st[2],group:g};
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8);
}
function getQualified(matches){
  const q={};
  GROUPS.forEach(g=>{
    const st=groupStandings(g,matches);
    const played=matches.filter(m=>m.phase==="csoport"&&m.group===g&&m.result).length;
    if(played>=6){q[g+"1"]=st[0]&&st[0].name;q[g+"2"]=st[1]&&st[1].name;q[g+"3"]=st[2]&&st[2].name;}
  });
  bestThirds(matches).forEach((t,i)=>q["3rd_"+(i+1)]=t.name);
  return q;
}
function matchesWithTeams(matches){
  const q=getQualified(matches);
  const ov=S.overrideTeams||{};
  const winner=(res,id)=>{
    const m=res.find(x=>x.id===id);
    if(!m||!m.result)return null;
    return +m.result.home>+m.result.away?m.home:(+m.result.away>+m.result.home?m.away:null);
  };
  const loser=(res,id)=>{
    const m=res.find(x=>x.id===id);
    if(!m||!m.result)return null;
    return +m.result.home>+m.result.away?m.away:(+m.result.away>+m.result.home?m.home:null);
  };
  let res=matches.map(m=>({...m}));
  for(let pass=0;pass<6;pass++){
    res=res.map(m=>{
      if(m.phase==="csoport")return m;
      if(!m.hs&&!m.as)return m;
      const resolveSlot=slot=>{
        if(!slot)return null;
        if(q[slot])return q[slot];
        if(slot.startsWith("3rd"))return slotLabel(slot);
        if(slot.endsWith("_loser"))return loser(res,slot.replace("_loser",""));
        return winner(res,slot);
      };
      const h=ov[m.id]&&ov[m.id].home||resolveSlot(m.hs)||m.home;
      const a=ov[m.id]&&ov[m.id].away||resolveSlot(m.as)||m.away;
      return{...m,home:h||slotLabel(m.hs),away:a||slotLabel(m.as)};
    });
  }
  return res;
}

function isEliminated(team,matches){
  if(!team)return false;
  const final=matches.find(m=>m.id==="final");
  if(final&&final.result){
    const rh=+final.result.home,ra=+final.result.away;
    const w=rh>ra?final.home:(ra>rh?final.away:null);
    if(w===team)return false;
  }
  for(const m of matches.filter(m=>m.phase!=="csoport"&&m.result)){
    const rh=+m.result.home,ra=+m.result.away;
    const l=rh>ra?m.away:(ra>rh?m.home:null);
    if(l===team)return true;
  }
  const teamGroup=Object.entries(TEAMS_BY_GROUP).find(([g,ts])=>ts.includes(team));
  if(teamGroup){
    const g=teamGroup[0];
    const played=matches.filter(m=>m.phase==="csoport"&&m.group===g&&m.result).length;
    if(played>=6){
      const inKO=matches.some(m=>m.phase!=="csoport"&&(m.home===team||m.away===team));
      if(!inKO)return true;
    }
  }
  return false;
}
function getFavPts(team,matches){
  if(!team)return 0;
  let pts=0;
  matches.filter(m=>m.result).forEach(m=>{
    const rh=+m.result.home,ra=+m.result.away;
    if(rh>ra&&m.home===team)pts+=1;
    else if(ra>rh&&m.away===team)pts+=1;
  });
  const final=matches.find(m=>m.id==="final");
  if(final&&final.result){
    const rh=+final.result.home,ra=+final.result.away;
    const w=rh>ra?final.home:(ra>rh?final.away:null);
    if(w===team)pts+=5;
  }
  return pts;
}

function calcPts(tip,res){
  if(!res||tip.home===""||tip.away==="")return null;
  const th=+tip.home,ta=+tip.away,rh=+res.home,ra=+res.away;
  if(isNaN(th)||isNaN(ta))return null;
  let pts=0;
  if(th===rh&&ta===ra)pts=3;
  else{
    const td=th-ta,rd=rh-ra;
    if(Math.sign(td)===Math.sign(rd)&&td===rd)pts=2;
    else if(Math.sign(td)===Math.sign(rd))pts=1;
    else pts=0;
  }
  // +1 bónusz ha eltalálta a döntés módját (csak kieséses meccseken)
  if(pts>0&&res.mode&&tip.mode&&res.mode===tip.mode)pts+=1;
  return pts;
}

function getPoints(u){
  const tipPts=S.matches.reduce(function(s,m){
    if(!m.result)return s;
    const tip=(S.tips[u]||{})[m.id];if(!tip)return s;
    const p=calcPts(tip,m.result);return p!==null?s+p:s;
  },0);
  const fav=(S.users_data[u]&&S.users_data[u].fav)||null;
  return tipPts+getFavPts(fav,S.matches);
}

    ?[["results","\uD83D\uDCCB Eredm\u00e9nyek"],["standings","\uD83D\uDCCA Tabella"],["players","\uD83D\uDC65 J\u00e1t\u00e9kosok"],["leaderboard","\uD83C\uDFC5 Ranglista"]]
    :[["matches","\u26BD M\u00e9rk\u0151z\u00e9sek"],["standings","\uD83D\uDCCA Tabella"],["leaderboard","\uD83C\uDFC5 Ranglista"]];
  return '<div class="tabs">'+tabs.map(function(t){return '<button class="tab-btn'+(S.tab===t[0]?" active":"")+ '" data-tab="'+t[0]+'">'+t[1]+"</button>";}).join("")+"</div>";
}

function renderContent(){
  const vis=S.matches.filter(function(m){return m.phase===S.phase&&(S.phase!=="csoport"||m.group===S.group);});
  if(S.tab==="matches")return renderMatches(vis);
  if(S.tab==="standings")return renderStandings();
  if(S.tab==="leaderboard")return renderLeaderboard();
  if(S.tab==="results")return renderResults();
  if(S.tab==="players")return renderPlayers();
  return '<p class="empty">Nincs tartalom.</p>';
}

function renderPhaseFilters(style){
  const phases=PHASE_ORDER.filter(function(p){return S.matches.some(function(m){return m.phase===p;});});
  let h='<div class="phase-filters">';
  phases.forEach(function(p){h+='<button class="filter-btn'+(S.phase===p?" a"+style:"")+'" data-phase="'+p+'">'+PHASE_LABEL[p]+"</button>";});
  h+="</div>";
  if(S.phase==="csoport"){
    h+='<div class="group-filters">';
    GROUPS.forEach(function(g){h+='<button class="group-btn'+(S.group===g?" a"+style:"")+'" data-group="'+g+'">'+g+"</button>";});
    h+="</div>";
  }
  return h;
}

function badgeHtml(p){
  if(p===3)return'<span class="badge badge-3">3 pont &#x2713;</span>';
  if(p===2)return'<span class="badge badge-2">2 pont</span>';
  if(p===1)return'<span class="badge badge-1">1 pont</span>';
  if(p===0)return'<span class="badge badge-0">0 pont</span>';
  return"";
}

function renderMatches(vis){
  let h=renderPhaseFilters("g")+'<div class="match-list">';
  vis.forEach(function(m){
    const locked=isLocked(m.time);
    const myTip=(S.tips[S.username]||{})[m.id]||{};
    const pts=m.result?calcPts(myTip,m.result):null;
    const saved=S.savedTips[m.id];
    const hVal=myTip.home||"";
    const aVal=myTip.away||"";
    const isKO=m.phase!=="csoport";
    const curMode=myTip.mode||"";
    const score=locked
      ?'<div class="score-wrap"><div class="score-box">'+(hVal||"-")+'</div><span class="score-sep">\u2013</span><div class="score-box">'+(aVal||"-")+"</div></div>"
      :'<div class="score-wrap"><input class="score-input" type="text" inputmode="numeric" maxlength="2" value="'+hVal+'" data-mid="'+m.id+'" data-side="home" '+OINP+'/><span class="score-sep">\u2013</span><input class="score-input" type="text" inputmode="numeric" maxlength="2" value="'+aVal+'" data-mid="'+m.id+'" data-side="away" '+OINP+"/></div>";
    const modeRow=isKO&&!locked
      ?'<div style="display:flex;justify-content:center;gap:6px;padding:6px 12px 8px">'
        +['90','H','B'].map(function(v){
          const labels={'90':'90\'','H':'Hossz.','B':'Bünt.'};
          const active=curMode===v;
          return '<button class="mode-btn'+(active?" mode-active":"")+'" data-mid="'+m.id+'" data-mode="'+v+'">'+labels[v]+'</button>';
        }).join("")
        +'</div>'
      : isKO&&locked&&myTip.mode
        ?'<div style="text-align:center;font-size:11px;color:#888;padding:4px 0 6px">Tippelt mód: <b style="color:#f0f0f0">'+({'90':"90'",H:"Hosszabbítás",B:"Büntetők"}[myTip.mode]||myTip.mode)+"</b></div>"
        :"";
    const resRow='<div class="result-row">'+(m.result
      ?'V\u00e9geredm\u00e9ny: <b>'+m.result.home+'\u2013'+m.result.away+'</b>'+(m.result.mode?' <span style="font-size:11px;color:#888">('+({'90':"90'",H:"Hosszabbítás",B:"Büntetők"}[m.result.mode]||m.result.mode)+')</span>':'')+" "+badgeHtml(pts)
      :"V\u00e9geredm\u00e9ny: \u2013")+"</div>";
    const savedRow=(!locked&&saved)?'<div class="saved-tip-row">&#x2713; Tipp elmentve: '+saved.home+"\u2013"+saved.away+(saved.mode?' ('+({'90':"90'",H:"Hosszabbítás",B:"Büntetők"}[saved.mode]||saved.mode)+')':'')+"</div>":"";
    h+='<div class="match-card"><div class="match-head"><span class="match-info">'+(m.group?m.group+" csoport":(m.label||""))+" &middot; "+fmtTime(m.time)+'</span><div>'+(locked&&!m.result?'<span class="badge badge-locked">Lez\u00e1rva</span>':"")+"</div></div>"
      +'<div class="match-body"><span class="team team-home">'+m.home+fi(m.home)+"</span>"+score+'<span class="team team-away">'+fi(m.away)+m.away+"</span></div>"
      +modeRow+resRow+savedRow+"</div>";
  });
  return h+"</div>";
}

function renderStandings(){
  let h='<div class="group-filters" style="margin-bottom:16px">';
  GROUPS.forEach(function(g){h+='<button class="group-btn'+(S.group===g?" ag":"")+'" data-group="'+g+'">'+g+"</button>";});
  h+="</div>";
  const g=S.group;
  const st=groupStandings(g,S.matches);
  const played=S.matches.filter(function(m){return m.phase==="csoport"&&m.group===g&&m.result;}).length;
  h+='<div class="table-card"><div class="table-title">'+g+" csoport "+(played>=6?"&#x2713;":"")+'</div><table class="standings-table"><thead><tr><th>#</th><th>Csapat</th><th>M</th><th>Gy</th><th>D</th><th>V</th><th>G</th><th>GK</th><th>P</th></tr></thead><tbody>';
  st.forEach(function(t,i){
    const rc=i===0?"q1":i===1?"q2":i===2?"q3":"";
    const pc=i===0?"p1":i===1?"p2":i===2?"p3":"p4";
    const gkC=t.gd>0?"#00c97a":t.gd<0?"#ff5252":"#f0f0f0";
    h+='<tr class="'+rc+'"><td><span class="pos-dot '+pc+'">'+(i+1)+'</span></td><td><div class="flag-name">'+fi(t.name,18)+"<span>"+t.name+"</span></div></td><td>"+t.mp+"</td><td>"+t.w+"</td><td>"+t.d+"</td><td>"+t.l+'</td><td>'+t.gf+":"+t.ga+'</td><td style="color:'+gkC+'">'+(t.gd>0?"+":"")+t.gd+'</td><td style="font-weight:700">'+t.pts+"</td></tr>";
  });
  h+="</tbody></table></div>";
  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#888;margin-bottom:16px"><span><span style="color:#00c97a">&#9632;</span> 1\u20132. hely: tov\u00e1bbjut</span><span><span style="color:#f0a500">&#9632;</span> 3. hely: esetleg tov\u00e1bbjut</span></div>';
  const b8=bestThirds(S.matches);
  if(b8.length>0){
    h+='<div class="table-card"><div class="table-title">Legjobb 3. helyezettek (top 8 tov\u00e1bbjut)</div><table class="standings-table"><thead><tr><th>#</th><th>Csapat</th><th>Cs.</th><th>M</th><th>Gy</th><th>D</th><th>V</th><th>G</th><th>GK</th><th>P</th></tr></thead><tbody>';
    b8.forEach(function(t,i){
      const gkC=t.gd>0?"#00c97a":t.gd<0?"#ff5252":"#f0f0f0";
      h+='<tr class="'+(i<8?"q2":"")+'"><td><span class="pos-dot '+(i<8?"p2":"p4")+'">'+(i+1)+'</span></td><td><div class="flag-name">'+fi(t.name,18)+"<span>"+t.name+'</span></div></td><td style="color:#888">'+t.group+"</td><td>"+t.mp+"</td><td>"+t.w+"</td><td>"+t.d+"</td><td>"+t.l+'</td><td>'+t.gf+":"+t.ga+'</td><td style="color:'+gkC+'">'+(t.gd>0?"+":"")+t.gd+'</td><td style="font-weight:700">'+t.pts+"</td></tr>";
    });
    h+="</tbody></table></div>";
  }
  return h;
}

function renderLeaderboard(){
  const board=S.users.map(function(u){return{name:u,pts:getPoints(u)};}).sort(function(a,b){return b.pts-a.pts;});
  const mc=function(i){return i===0?"#f0a500":i===1?"#aaa":i===2?"#cd7f32":"#444";};
  let h='<div class="board-list">';
  if(!board.length)h+='<p class="empty">M\u00e9g nincs r\u00e9szt\u0151ev\u0151.</p>';
  board.forEach(function(u,i){
    const fav=(S.users_data[u.name]&&S.users_data[u.name].fav)||null;
    const elim=fav&&isEliminated(fav,S.matches);
    const favHtml=fav
      ?'<div style="font-size:11px;color:'+(elim?"#ff5252":"#888")+';display:flex;align-items:center;gap:3px;margin-top:2px">'+fi(fav,14)+" "+fav+(elim?" (kiesett)":"")+"</div>"
      :"";
    h+='<div class="board-row'+(u.name===S.username?" me":"")+(i===0?" first":i===1?" second":"")+'"><span class="rank-circle" style="border:1px solid '+mc(i)+'55;color:'+mc(i)+'">'+(i+1)+'</span><div style="flex:1;min-width:0"><div style="font-weight:'+(u.name===S.username||i<2?700:400)+';font-size:14px">'+u.name+"</div>"+favHtml+'</div><span style="font-weight:700;font-size:22px;color:'+(i===0?"#f0a500":"#00c97a")+'">'+u.pts+'</span><span style="font-size:12px;color:#444">pont</span></div>';
  });
  h+='</div><div class="rules-card"><div style="font-weight:700;font-size:13px;color:#00c97a;margin-bottom:8px">Ponoz\u00e1si szab\u00e1lyok</div>';
  [[3,"rgba(0,201,122,.12)","#00c97a","Pontos eredm\u00e9ny"],[2,"rgba(76,163,255,.12)","#4ca3ff","Helyes g\u00f3lk\u00fcl\u00f6nbs\u00e9g + gy\u0151ztes"],[1,"rgba(240,165,0,.12)","#f0a500","Csak a gy\u0151ztes eltal\u00e1lva"],[0,"rgba(255,82,82,.12)","#ff5252","T\u00e9ves tipp"]].forEach(function(r){
    h+='<div class="rule-row"><span class="rule-badge" style="background:'+r[1]+';color:'+r[2]+'">'+r[0]+' pont</span><span style="color:#888;font-size:13px">'+r[3]+"</span></div>";
  });
  h+='</div><div style="margin-top:12px;background:#1c1c1c;border-radius:10px;padding:10px 14px;font-size:12px;color:#888"><b style="color:#00c97a">Kedvenc csapat bónusz:</b> +1 pont minden gy\u0151ztes meccs ut\u00e1n, +5 pont VB gy\u0151zelem eset\u00e9n</div>';
  return h;
}

function renderResults(){
  const vis=S.matches.filter(function(m){return m.phase===S.phase&&(S.phase!=="csoport"||m.group===S.group);});
  let h='<p style="color:#888;font-size:13px;margin-bottom:10px">A mez\u0151b\u0151l kil\u00e9pve automatikusan ment.</p>';
  h+=renderPhaseFilters("p");
  vis.forEach(function(m){
    const er=S.editRes[m.id]||{};
    const isKnownH=!!FLAG_CODES[m.home]||!!(S.overrideTeams[m.id]&&S.overrideTeams[m.id].home);
    const isKnownA=!!FLAG_CODES[m.away]||!!(S.overrideTeams[m.id]&&S.overrideTeams[m.id].away);
    const ovH=(S.overrideTeams[m.id]&&S.overrideTeams[m.id].home)||m.home;
    const ovA=(S.overrideTeams[m.id]&&S.overrideTeams[m.id].away)||m.away;
    const hF=isKnownH
      ?'<span class="team team-home" style="font-size:13px">'+m.home+fi(m.home)+"</span>"
      :'<input type="text" value="'+ovH+'" data-override="'+m.id+'" data-override-side="home" class="ov-input" placeholder="Hazai" style="flex:1;text-align:right"/>';
    const aF=isKnownA
      ?'<span class="team team-away" style="font-size:13px">'+fi(m.away)+m.away+"</span>"
      :'<input type="text" value="'+ovA+'" data-override="'+m.id+'" data-override-side="away" class="ov-input" placeholder="Vend\u00e9g" style="flex:1;text-align:left"/>';
    const isKO=m.phase!=="csoport";
    const curResMode=(S.editRes[m.id]&&S.editRes[m.id].mode)||(m.result&&m.result.mode)||"";
    const modeRow=isKO
      ?'<div style="display:flex;justify-content:center;gap:6px;padding:6px 12px 8px">'
        +['90','H','B'].map(function(v){
          const labels={'90':"90'",H:'Hossz.',B:'B\u00fcnt.'};
          const active=curResMode===v;
          return '<button class="mode-btn'+(active?" mode-active":"")+'" data-rmid="'+m.id+'" data-rval="'+v+'">'+labels[v]+'</button>';
        }).join("")
        +'</div>'
      :"";
    h+='<div class="admin-card"><div class="admin-head">'+(m.group?m.group+" csoport":(m.label||""))+" &middot; "+fmtTime(m.time)+'</div><div class="admin-body">'+hF
      +'<input class="score-input" type="text" inputmode="numeric" maxlength="2" placeholder="\u2013" value="'+(er.home!==undefined?er.home:(m.result&&m.result.home?m.result.home:""))+'" data-res="'+m.id+'" data-res-side="home" style="border-color:rgba(180,158,255,.33)" '+OINP+'/>'
      +'<span class="score-sep">\u2013</span>'
      +'<input class="score-input" type="text" inputmode="numeric" maxlength="2" placeholder="\u2013" value="'+(er.away!==undefined?er.away:(m.result&&m.result.away?m.result.away:""))+'" data-res="'+m.id+'" data-res-side="away" style="border-color:rgba(180,158,255,.33)" '+OINP+'/>'
      +aF+"</div>"+modeRow+"</div>";
  });
  return h||'<p class="empty">Nincs m\u00e9rk\u0151z\u00e9s.</p>';
}

function renderPlayers(){
  let h='<p style="color:#888;font-size:13px;margin-bottom:14px">Regisztr\u00e1lt j\u00e1t\u00e9kosok kezel\u00e9se.</p>';
  if(!S.users.length)return h+'<p class="empty">M\u00e9g nincs regisztr\u00e1lt j\u00e1t\u00e9kos.</p>';
  S.users.forEach(function(u,i){
    const pts=getPoints(u);
    const tc=Object.keys(S.tips[u]||{}).length;
    h+='<div class="player-card"><div class="player-avatar">'+u[0].toUpperCase()+'</div><div style="flex:1"><div style="font-weight:600;font-size:14px">'+u+'</div><div style="font-size:12px;color:#444">'+tc+' tipp &middot; '+pts+' pont</div></div><span style="font-size:12px;padding:3px 10px;border-radius:8px;background:#1c1c1c;color:#888;border:1px solid #272727">#'+(i+1)+'</span><button class="del-btn" data-del="'+u+'">&#x1F5D1; T\u00f6rl\u00e9s</button></div>';
  });
  const tot=Object.values(S.tips).reduce(function(s,t){return s+Object.keys(t).length;},0);
  return h+'<div style="margin-top:16px;background:#141414;border:1px solid #272727;border-radius:12px;padding:12px 16px;font-size:13px;color:#888"><strong style="color:#b49eff">\u00d6sszeg: </strong>'+S.users.length+' j\u00e1t\u00e9kos &middot; '+tot+' tipp</div>';
}

function renderModal(){
  return '<div class="modal-overlay"><div class="modal"><div style="font-size:32px;margin-bottom:12px">&#x1F5D1;</div><div style="font-weight:700;font-size:16px;margin-bottom:8px">J\u00e1t\u00e9kos t\u00f6rl\u00e9se</div><div style="color:#888;font-size:14px">Biztosan t\u00f6rl\u00f6d <strong style="color:#f0f0f0">'+S.delConfirm+"</strong> j\u00e1t\u00e9kost?</div>"
    +'<div class="modal-btns"><button class="modal-cancel" id="cancelDel">M\u00e9gse</button><button class="modal-del" id="confirmDel">T\u00f6rl\u00e9s</button></div></div></div>';
}

function bindEvents(){
  document.getElementById("logoutBtn")&&document.getElementById("logoutBtn").addEventListener("click",function(){
    clearInterval(S.pollTimer);S.username="";S.tab="matches";
    lsDel(LS_USER);lsDel(LS_TAB);
    showPage("pg-login");
    document.getElementById("nameInput").value="";
    document.getElementById("pwInput").value="";
    document.getElementById("pwHint").style.display="block";
  });
  document.getElementById("themeBtn")&&document.getElementById("themeBtn").addEventListener("click",function(){
    const isLight=document.body.classList.toggle("light");
    document.getElementById("themeBtn").textContent=isLight?"\u2600\uFE0F":"\uD83C\uDF19";
    lsSet("vb26_theme",isLight?"light":"dark");
  });
  document.querySelectorAll("[data-tab]").forEach(function(b){b.addEventListener("click",function(){S.tab=b.dataset.tab;lsSet(LS_TAB,S.tab);renderMain();});});
  document.querySelectorAll("[data-phase]").forEach(function(b){b.addEventListener("click",function(){S.phase=b.dataset.phase;renderMain();});});
  document.querySelectorAll("[data-group]").forEach(function(b){b.addEventListener("click",function(){S.group=b.dataset.group;renderMain();});});
  document.querySelectorAll(".score-input[data-mid]").forEach(function(inp){
    inp.addEventListener("input",function(){
      const mid=inp.dataset.mid,side=inp.dataset.side;
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=inp.value;
    });
    inp.addEventListener("blur",async function(){
      const mid=inp.dataset.mid,side=inp.dataset.side,val=inp.value;
      if(val==="")return;
      const os=side==="home"?"away":"home";
      const oi=document.querySelector('.score-input[data-mid="'+mid+'"][data-side="'+os+'"]');
      const ov2=oi?oi.value:((S.tips[S.username]||{})[mid]||{})[os]||"";
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid][side]=val;
      await dbSet("tips/"+S.username+"/"+mid+"/"+side,val);
      if(val&&ov2){
        const hv=side==="home"?val:ov2,av=side==="away"?val:ov2;
        S.savedTips[mid]={home:hv,away:av};
        const card=inp.closest(".match-card");
        if(card){
          card.querySelectorAll(".saved-tip-row").forEach(function(el){el.remove();});
          const div=document.createElement("div");
          div.className="saved-tip-row";
          div.innerHTML="&#x2713; Tipp elmentve: "+hv+"\u2013"+av;
          card.appendChild(div);
        }
      }
    });
  });
  document.querySelectorAll(".score-input[data-res]").forEach(function(inp){
    inp.addEventListener("change",function(){
      const mid=inp.dataset.res,side=inp.dataset.resSide;
      S.editRes[mid]=S.editRes[mid]||{};
      S.editRes[mid][side]=inp.value;
    });
    inp.addEventListener("blur",async function(){
      const mid=inp.dataset.res,r=S.editRes[mid];
      if(!r||r.home===undefined||r.away===undefined||r.home===""||r.away==="")return;
      const toSave={home:r.home,away:r.away};
      if(r.mode)toSave.mode=r.mode;
      await dbSet("results/"+mid,toSave);
      await pollData();
      renderMain();
    });
  });
  document.querySelectorAll("[data-override]").forEach(function(inp){
    inp.addEventListener("blur",async function(){
      const mid=inp.dataset.override,side=inp.dataset.overrideSide,val=inp.value.trim();
      if(!val)return;
      S.overrideTeams[mid]=S.overrideTeams[mid]||{};
      S.overrideTeams[mid][side]=val;
      await dbSet("overrides/"+mid+"/"+side,val);
      if(FLAG_CODES[val]){
        const span=document.createElement("span");
        span.className="team "+(side==="home"?"team-home":"team-away");
        span.style.fontSize="13px";
        span.innerHTML=side==="home"?val+fi(val):fi(val)+val;
        inp.replaceWith(span);
      }
      await pollData();
    });
  });
  // Módválasztó gombok
  document.querySelectorAll(".mode-btn[data-mode]").forEach(function(btn){
    btn.addEventListener("click",async function(){
      const mid=btn.dataset.mid,mode=btn.dataset.mode;
      S.tips[S.username]=S.tips[S.username]||{};
      S.tips[S.username][mid]=S.tips[S.username][mid]||{};
      S.tips[S.username][mid].mode=mode;
      await dbSet("tips/"+S.username+"/"+mid+"/mode",mode);
      // Frissítjük a savedTips módját is
      if(S.savedTips[mid])S.savedTips[mid].mode=mode;
      renderMain();
    });
  });
  document.getElementById("cancelDel")&&document.getElementById("cancelDel").addEventListener("click",function(){S.delConfirm=null;renderMain();});
  document.getElementById("confirmDel")&&document.getElementById("confirmDel").addEventListener("click",async function(){
    const name=S.delConfirm;
    await dbDel("users/"+name);await dbDel("tips/"+name);
    S.delConfirm=null;showToast(name+" t\u00f6r\u00f6lve","info");await pollData();
  });
}

async function init(){
  if(lsGet("vb26_theme")==="light")document.body.classList.add("light");

  // Admin módválasztó — egyszer regisztrálva
  document.body.addEventListener("click",async function(e){
    const btn=e.target.closest("[data-rmid]");
    if(!btn)return;
    const mid=btn.dataset.rmid, mode=btn.dataset.rval;
    S.editRes[mid]=S.editRes[mid]||{};
    S.editRes[mid].mode=mode;
    btn.parentElement.querySelectorAll(".mode-btn").forEach(function(b){
      b.classList.toggle("mode-active", b.dataset.rval===mode);
    });
    const r=S.editRes[mid];
    if(r&&r.home!==undefined&&r.away!==undefined&&r.home!==""&&r.away!==""){
      await dbSet("results/"+mid,{home:r.home,away:r.away,mode:mode});
      await pollData();
    }
  });
  const savedUser=lsGet(LS_USER);
  const savedTab=lsGet(LS_TAB);
  if(savedUser){
    showPage("pg-loading");
    S.username=savedUser;
    S.tab=savedTab||(savedUser===ADMIN?"results":"matches");
    await pollData();
    startPolling();
    showPage("pg-main");
    renderMain();
  } else {
    showPage("pg-login");
  }
}

init();
</script>
